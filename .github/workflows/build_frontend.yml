name: Build Frontend

on:
  workflow_call:

jobs:
  build-frontend:
    name: Build Frontend

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          working-directory: front
          cache: true

      - name: Build frontend app
        run: |
          cd front
          pnpm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: front/out
